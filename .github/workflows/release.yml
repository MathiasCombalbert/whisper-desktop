name: Build & Release Multiplatform Executables

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Application with PyInstaller
        run: |
          pyinstaller --noconsole --onedir --name "WhisperDesktop" `
            --add-data "config.json;." `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --hidden-import "pystray" `
            --hidden-import "sounddevice" `
            --hidden-import "keyboard" `
            --hidden-import "pyperclip" `
            --hidden-import "pynput" `
            src/app.py

      - name: Copy auxiliary files to dist
        run: |
          Copy-Item -Path "config.json" -Destination "dist/WhisperDesktop/"
          Copy-Item -Path "run_debug.bat" -Destination "dist/WhisperDesktop/"
          Copy-Item -Path "LICENSE" -Destination "dist/WhisperDesktop/"
          Copy-Item -Path "README.md" -Destination "dist/WhisperDesktop/"

      - name: Compress Release Archive
        run: |
          Compress-Archive -Path dist/WhisperDesktop -DestinationPath "dist/WhisperDesktop-Windows-x64.zip"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperDesktop-Windows-x64
          path: dist/WhisperDesktop-Windows-x64.zip

  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Linux System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            portaudio19-dev \
            libasound2-dev \
            libx11-dev \
            libx11-6 \
            xdotool \
            python3-tk \
            patchelf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Application with PyInstaller
        run: |
          pyinstaller --noconsole --onedir --name "WhisperDesktop" \
            --add-data "config.json:." \
            --collect-all faster_whisper \
            --collect-all ctranslate2 \
            --hidden-import "pystray" \
            --hidden-import "sounddevice" \
            --hidden-import "keyboard" \
            --hidden-import "pyperclip" \
            --hidden-import "pynput" \
            src/app.py

      - name: Copy auxiliary files and package
        run: |
          cp config.json dist/WhisperDesktop/
          cp README.md dist/WhisperDesktop/
          cp LICENSE dist/WhisperDesktop/
          chmod +x dist/WhisperDesktop/WhisperDesktop
          cd dist
          tar -czvf WhisperDesktop-Linux-x64.tar.gz WhisperDesktop/

      - name: Test Linux Binary Smoke Test
        run: |
          test -f dist/WhisperDesktop/WhisperDesktop
          test -f dist/WhisperDesktop-Linux-x64.tar.gz

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhisperDesktop-Linux-x64
          path: dist/WhisperDesktop-Linux-x64.tar.gz

  release:
    name: Publish Multiplatform Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List Release Assets
        run: ls -lh release-assets/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/WhisperDesktop-Windows-x64.zip
            release-assets/WhisperDesktop-Linux-x64.tar.gz
          name: "Whisper Desktop ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
